[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-match-assistant"
version = "0.1.0"
description = "Job Match Assistant & ATS Scorer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "apify-client>=1.0.0",
    "nicegui>=1.4.0",
    "openai>=1.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

